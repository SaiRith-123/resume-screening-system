name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (light CI profile)
        run: pip install -r requirements-ci.txt
      - name: Run test suite
        run: pytest -p no:cacheprovider
        env:
          DATABASE_URL: sqlite://

  frontend:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build

  streamlit:
    name: Streamlit app smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamlit_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Render smoke test
        run: python -c "
from streamlit.testing.v1 import AppTest
at = AppTest.from_file('app.py', default_timeout=300)
at.run()
assert not at.exception, 'Streamlit app raised an exception'
print('Streamlit render OK')"
